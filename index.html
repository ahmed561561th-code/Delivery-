<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الركن الشامي - تطبيق الكابتن</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, #090d16 70%);
      color: #f8fafc;
      min-height: 100vh;
    }
  </style>
</head>
<body class="pb-20">

  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-900/90 backdrop-blur border border-slate-700/80 w-full max-w-md rounded-3xl p-7 space-y-5 shadow-2xl">
      <div class="text-center space-y-2">
        <div class="inline-flex items-center gap-2 bg-gradient-to-r from-red-600 to-amber-500 text-white font-black px-4 py-1.5 rounded-2xl text-base shadow">
          <span>🛵 الركن الشامي</span>
        </div>
        <h1 class="text-2xl font-black tracking-tight">بوابة دخول كابتن التوصيل</h1>
        <p class="text-xs text-slate-400 font-bold">سجّل دخولك باليوزر نيم والباسورد الخاصين بك</p>
      </div>

      <div class="space-y-3">
        <input type="text" id="driverLoginUser" placeholder="اسم المستخدم (Username)" class="w-full p-3.5 rounded-2xl bg-slate-950 border border-slate-700 text-white font-black text-sm outline-none focus:border-amber-400 transition">
        <input type="password" id="driverLoginPass" placeholder="كلمة المرور (Password)" class="w-full p-3.5 rounded-2xl bg-slate-950 border border-slate-700 text-white font-black text-sm outline-none focus:border-amber-400 transition">
      </div>

      <button onclick="loginDriverWithCredentials()" class="w-full bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-slate-950 py-3.5 rounded-2xl font-black text-base shadow-lg shadow-emerald-950/60 transition">
        🚀 دخول وتفعيل الرنين
      </button>
    </div>
  </div>

  <div id="driverDashboard" class="hidden max-w-xl mx-auto p-4 space-y-5">
    <header class="bg-slate-900/95 border border-slate-700/80 rounded-3xl p-4 shadow-2xl space-y-3">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-2xl bg-amber-400 text-slate-950 flex items-center justify-center font-black text-xl shadow">🛵</div>
          <div>
            <span class="text-[11px] text-slate-400 font-bold block">كابتن التوصيل</span>
            <h2 id="activeDriverName" class="text-lg font-black text-amber-400 leading-tight"></h2>
          </div>
        </div>
        <div class="flex items-center gap-1.5">
          <button onclick="toggleTodayHistoryModal()" class="bg-blue-600 hover:bg-blue-500 px-3 py-2 rounded-xl text-xs font-black text-white shadow">📋 أوردرات اليوم</button>
          <button onclick="logoutDriver()" class="bg-slate-800 hover:bg-red-700 px-3 py-2 rounded-xl text-xs font-bold text-slate-300 transition">خروج</button>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2.5 pt-2 border-t border-slate-800 text-center">
        <div class="bg-slate-950/90 border border-slate-800 p-3 rounded-2xl">
          <div class="text-[11px] text-slate-400 font-bold">أوردرات تم تسليمها</div>
          <div id="drvCompletedCount" class="text-2xl font-black text-white mt-0.5">0</div>
        </div>
        <div class="bg-slate-950/90 border border-slate-800 p-3 rounded-2xl">
          <div class="text-[11px] text-slate-400 font-bold">إجمالي العهدة المسلمة</div>
          <div id="drvCashTotal" class="text-2xl font-black text-emerald-400 mt-0.5">0 ج.م</div>
        </div>
      </div>
    </header>

    <div class="space-y-2.5">
      <div class="flex items-center justify-between px-1">
        <h3 class="font-black text-base text-amber-400">🔥 أوردرات في عهدتك الآن</h3>
      </div>
      <div id="driverActiveOrders" class="space-y-3"></div>
    </div>

    <div class="space-y-2.5 pt-2">
      <h3 class="font-black text-sm text-slate-400 px-1">✅ أوردرات تم تسليمها اليوم</h3>
      <div id="driverDoneOrders" class="space-y-2"></div>
    </div>
  </div>

  <div id="todayHistoryModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-lg rounded-3xl p-5 max-h-[85vh] flex flex-col space-y-3 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-base font-black text-amber-400">📋 سجل أوردرات اليوم التي خرجت</h3>
        <button onclick="toggleTodayHistoryModal()" class="w-8 h-8 rounded-xl bg-slate-800 text-slate-300 font-black">✕</button>
      </div>
      <div id="allTodayDriverOrdersList" class="overflow-y-auto space-y-2 text-xs font-bold"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const app = initializeApp({ databaseURL: "https://alrukn-90cc9-default-rtdb.firebaseio.com/" });
    const db = getDatabase(app);

    let drivers = {}, currentDriverId = localStorage.getItem('rukn_driver_id') || '';
    let ringingLoop = null;
    let allDriverOrdersCache = [];

    onValue(ref(db, 'drivers'), snap => {
      drivers = snap.val() || {};
      if (currentDriverId && drivers[currentDriverId]) {
        showDashboard();
      }
    });

    window.loginDriverWithCredentials = async () => {
      const u = document.getElementById('driverLoginUser').value.trim();
      const p = document.getElementById('driverLoginPass').value.trim();
      if (!u || !p) return alert('أدخل اليوزر نيم والباسورد!');

      const matched = Object.entries(drivers).find(([_, d]) => String(d.username || '').trim() === u && String(d.password || '').trim() === p);
      if (!matched) return alert('بيانات الدخول غير صحيحة! راجع الكاشير.');

      currentDriverId = matched[0];
      localStorage.setItem('rukn_driver_id', currentDriverId);

      if ('Notification' in window && Notification.permission !== 'granted') {
        await Notification.requestPermission();
      }
      playRingOnce();
      showDashboard();
    };

    window.logoutDriver = () => {
      stopRingingLoop();
      localStorage.removeItem('rukn_driver_id');
      location.reload();
    };

    function playRingOnce() {
      try {
        if (navigator.vibrate) navigator.vibrate([400, 150, 400]);
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(820, ctx.currentTime);
        osc.frequency.setValueAtTime(1120, ctx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.45, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
      } catch (e) {}
    }

    function startRingingLoop() {
      if (ringingLoop) return;
      playRingOnce();
      ringingLoop = setInterval(playRingOnce, 2200);
    }

    function stopRingingLoop() {
      if (ringingLoop) {
        clearInterval(ringingLoop);
        ringingLoop = null;
      }
    }

    function showDashboard() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('driverDashboard').classList.remove('hidden');
      document.getElementById('activeDriverName').textContent = drivers[currentDriverId]?.name || '';

      onValue(ref(db, 'orders'), snap => {
        const orders = snap.val() || {};
        const myOrders = Object.entries(orders).filter(([_, o]) => o.driverId === currentDriverId && o.status !== 'cancelled');
        allDriverOrdersCache = myOrders.map(([id, o]) => ({ id, ...o })).reverse();

        const active = myOrders.filter(([_, o]) => o.status === 'out_for_delivery');
        const unaccepted = active.filter(([_, o]) => !o.driverAccepted);
        const done = myOrders.filter(([_, o]) => o.status === 'completed');

        if (unaccepted.length > 0) {
          startRingingLoop();
        } else {
          stopRingingLoop();
        }

        document.getElementById('drvCompletedCount').textContent = done.length;
        const cashTotal = done.reduce((s, [_, o]) => s + Number(o.total || 0), 0);
        document.getElementById('drvCashTotal').textContent = `${cashTotal} ج.م`;

        const activeBox = document.getElementById('driverActiveOrders');
        activeBox.innerHTML = active.map(([id, o]) => {
          const waMsg = encodeURIComponent(`أهلاً أستاذ ${o.customer?.name}، أنا مندوب توصيل مطعم الركن الشامي وفي طريقي إليك الآن بأوردر رقم #${o.orderNumber}.`);
          const mapQuery = encodeURIComponent(`${o.customer?.zoneName || ''} ${o.customer?.address || ''}`);
          const needsAccept = !o.driverAccepted;

          return `
            <div class="bg-slate-900/95 border-2 ${needsAccept ? 'border-red-500 animate-pulse' : 'border-amber-400/80'} rounded-3xl p-4 shadow-2xl space-y-3">
              <div class="flex justify-between items-center border-b border-slate-800 pb-2.5">
                <span class="bg-amber-400 text-slate-950 font-black px-3.5 py-1 rounded-xl text-lg">#${o.orderNumber}</span>
                <span class="text-2xl font-black text-emerald-400">${o.total} ج.م</span>
              </div>

              ${needsAccept ? `
                <button onclick="acceptDriverOrder('${id}')" class="w-full bg-red-600 hover:bg-red-700 text-white py-3.5 rounded-2xl font-black text-base shadow-lg transition">
                  🔔 قبول الأوردر وإيقاف الرنين الآن
                </button>
              ` : ''}

              <div class="space-y-1.5 text-sm font-bold">
                <div class="text-base font-black text-white">👤 ${o.customer?.name}</div>
                <div class="text-amber-300">📍 المنطقة: ${o.customer?.zoneName}</div>
                <div class="text-slate-200">🏠 العنوان: ${o.customer?.address}</div>
                <div class="bg-slate-950 border border-slate-800 p-2.5 rounded-2xl text-xs text-slate-300">
                  الدور: <b class="text-white">${o.customer?.floor || '-'}</b> | الشقة: <b class="text-white">${o.customer?.apt || '-'}</b> | علامة: <b class="text-amber-300">${o.customer?.landmark || '-'}</b>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-2 pt-1">
                <a href="tel:${o.customer?.phone1}" class="bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-2xl font-black text-xs text-center shadow">📞 اتصال أساسي (${o.customer?.phone1})</a>
                ${o.customer?.phone2 ? `<a href="tel:${o.customer.phone2}" class="bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-2xl font-black text-xs text-center shadow">📞 اتصال احتياطي (${o.customer.phone2})</a>` : `<a href="https://wa.me/2${o.customer?.phone1}?text=${waMsg}" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-2xl font-black text-xs text-center shadow">💬 واتساب للعميل</a>`}
              </div>
              <div class="grid grid-cols-2 gap-2">
                ${o.customer?.phone2 ? `<a href="https://wa.me/2${o.customer?.phone1}?text=${waMsg}" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-2xl font-black text-xs text-center shadow">💬 واتساب</a>` : ''}
                <a href="https://www.google.com/maps/search/?api=1&query=${mapQuery}" target="_blank" class="${o.customer?.phone2 ? '' : 'col-span-2'} bg-slate-800 hover:bg-slate-700 text-white py-2.5 rounded-2xl font-black text-xs text-center border border-slate-700">🗺️ فتح العنوان على الخريطة</a>
              </div>

              <button onclick="completeDelivery('${id}')" class="w-full bg-gradient-to-r from-emerald-400 to-emerald-500 hover:from-emerald-300 hover:to-emerald-400 text-slate-950 py-3.5 rounded-2xl font-black text-base shadow-lg mt-2 transition">
                ✅ تم التسليم
              </button>
            </div>
          `;
        }).join('') || '<div class="bg-slate-900/70 border border-slate-800 p-6 rounded-3xl text-center text-slate-400 font-bold text-sm">لا توجد أوردرات معك حالياً.. في انتظار إسناد أوردر من الكاشير</div>';

        document.getElementById('driverDoneOrders').innerHTML = done.map(([_, o]) => `
          <div class="bg-slate-900/70 border border-slate-800 p-3.5 rounded-2xl flex justify-between items-center text-xs font-bold gap-2">
            <span>#${o.orderNumber} - ${o.customer?.name} (${o.customer?.zoneName})</span>
            <div class="flex items-center gap-2">
              <span class="text-emerald-400 font-black text-sm">${o.total} ج.م</span>
              <span class="px-2 py-0.5 rounded-lg text-[10px] ${o.settledInVault ? 'bg-emerald-950 text-emerald-300' : 'bg-amber-950 text-amber-300'}">${o.settledInVault ? 'محصّل في الخزنة' : 'في العهدة'}</span>
            </div>
          </div>
        `).join('');

        renderTodayHistoryList();
      });
    }

    window.acceptDriverOrder = async (orderId) => {
      await update(ref(db, `orders/${orderId}`), {
        driverAccepted: true,
        driverAcceptedAt: Date.now()
      });
      stopRingingLoop();
    };

    window.completeDelivery = async (orderId) => {
      if (!confirm('تأكيد تسليم الأوردر عند الزبون؟')) return;
      await update(ref(db, `orders/${orderId}`), {
        status: 'completed',
        driverAccepted: true,
        settledInVault: false,
        completedAt: Date.now()
      });
    };

    window.toggleTodayHistoryModal = () => {
      document.getElementById('todayHistoryModal').classList.toggle('hidden');
      renderTodayHistoryList();
    };

    function renderTodayHistoryList() {
      const box = document.getElementById('allTodayDriverOrdersList');
      if (!box) return;
      if (allDriverOrdersCache.length === 0) {
        box.innerHTML = '<div class="text-center text-slate-400 py-6">لا توجد أوردرات مسجلة اليوم</div>';
        return;
      }
      box.innerHTML = allDriverOrdersCache.map(o => `
        <div class="bg-slate-950 border border-slate-800 p-3 rounded-2xl flex justify-between items-center">
          <div>
            <div class="text-white font-black">#${o.orderNumber} — ${o.customer?.name || ''}</div>
            <div class="text-slate-400 text-[11px]">${o.customer?.zoneName || ''} | ${o.status === 'completed' ? 'تم التسليم ✅' : 'في الطريق 🛵'}</div>
          </div>
          <div class="text-emerald-400 font-black text-sm">${o.total} ج.م</div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
