<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#09090b">
  
  <!-- إعدادات PWA للشاشة الرئيسية -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="طيار الركن الشامي">
  <title>تطبيق الطيارين - الركن الشامي</title>

  <!-- Web App Manifest مدمج تلقائياً -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"تطبيق الطيار - الركن الشامي","short_name":"الطيار","start_url":"/","display":"standalone","background_color":"#09090b","theme_color":"#09090b","icons":[{"src":"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgYDIEqcDEQOb7vPbahxCYf7xbY8dt4Mg8RM3JZM7gWnEnghUm7HR6JPOy2wJSkl_pxcAsnPCbuqtDiPCxg-Kx9N0J5n3yckarG-1BtFKjT4O65lGwZ3a2wjQIUssdT9XpCrc0DNpYF3hpp2snQDdfFOUBK3olE7M7QNNAy8DHcXMKj3t8D6veY9Mj576oA/s320/WhatsApp%20Image%202025-06-11%20at%204.34.21%20PM.jpeg","sizes":"192x192","type":"image/jpeg"}]}'>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <!-- OneSignal SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "c4e3f190-e5b2-4f2b-9f50-fb383ebccab8",
        safari_web_id: "web.onesignal.auto.xxxxx",
        notifyButton: { enable: true }
      });
    });
  </script>

  <style>
    body, input, select, button, h1, h2, h3, h4, p, span, div { font-family: 'Tajawal', sans-serif; }
    .glow-ring { box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
    .glass-card { background: rgba(24, 24, 27, 0.85); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen pb-16 max-w-md mx-auto border-x border-stone-800 shadow-2xl relative select-none">

  <!-- صوت التنبيه المستمر داخل التطبيق -->
  <audio id="driver-alert-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto" loop></audio>

  <!-- الهيدر -->
  <header class="bg-gradient-to-r from-stone-900 via-stone-950 to-stone-900 p-4 sticky top-0 z-30 border-b border-stone-800/80 shadow-xl">
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="relative">
          <div class="w-11 h-11 rounded-2xl bg-amber-500/20 text-amber-400 border border-amber-500/40 flex items-center justify-center text-xl shadow-lg">🛵</div>
          <span id="wake-lock-status-dot" class="absolute -bottom-1 -right-1 w-3.5 h-3.5 bg-emerald-500 border-2 border-stone-950 rounded-full" title="نشط"></span>
        </div>
        <div>
          <h1 class="text-base font-black text-amber-400 leading-tight">تطبيق الكابتن ⚡</h1>
          <p id="header-driver-display" class="text-xs text-stone-400 font-bold">مطعم الركن الشامي</p>
        </div>
      </div>

      <button onclick="toggleSoundSetting()" id="sound-toggle-btn" class="bg-amber-500/20 border border-amber-500/40 text-amber-400 p-2.5 rounded-xl transition">
        <i class="fa-solid fa-bell text-sm"></i>
      </button>
    </div>
  </header>

  <main class="p-4 space-y-4">

    <!-- تسجيل الدخول -->
    <div id="driver-setup-card" class="glass-card p-4 rounded-2xl border border-stone-800 space-y-3 shadow-xl">
      <div class="flex items-center gap-2 text-xs font-bold text-amber-400">
        <i class="fa-solid fa-user-gear"></i>
        <span>تسجيل اسم الطيار:</span>
      </div>
      <div class="flex gap-2">
        <input type="text" id="driver-name-input" placeholder="ادخل اسمك المسجل لدى الكاشير..." class="flex-1 bg-stone-900 border border-stone-700 rounded-xl px-3 py-2.5 text-xs text-amber-400 font-bold focus:outline-none focus:border-amber-500">
        <button onclick="saveDriverName()" class="bg-amber-500 hover:bg-amber-600 text-stone-950 font-black text-xs px-5 py-2.5 rounded-xl transition shadow">حفظ</button>
      </div>
    </div>

    <!-- الإحصائيات -->
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-stone-900/90 border border-stone-800/80 p-3 rounded-2xl flex items-center gap-3 shadow">
        <div class="w-9 h-9 rounded-xl bg-blue-500/10 text-blue-400 border border-blue-500/20 flex items-center justify-center text-sm font-black"><i class="fa-solid fa-box"></i></div>
        <div>
          <span class="text-[10px] text-stone-400 font-bold block">أوردرات اليوم</span>
          <span id="stat-driver-delivered-count" class="text-sm font-black text-white">0</span>
        </div>
      </div>

      <div class="bg-stone-900/90 border border-stone-800/80 p-3 rounded-2xl flex items-center gap-3 shadow">
        <div class="w-9 h-9 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center justify-center text-sm font-black"><i class="fa-solid fa-hand-holding-dollar"></i></div>
        <div>
          <span class="text-[10px] text-stone-400 font-bold block">عمولات التوصيل</span>
          <span id="stat-driver-delivery-total" class="text-sm font-black text-emerald-400">0 ج.م</span>
        </div>
      </div>
    </div>

    <!-- الطلبات -->
    <div class="flex justify-between items-center pt-2">
      <h2 class="text-xs font-black text-stone-300 flex items-center gap-1.5"><i class="fa-solid fa-route text-amber-500"></i> الطلبات الحالية</h2>
      <span id="orders-count-badge" class="bg-stone-900 border border-stone-800 text-amber-400 text-[10px] px-2.5 py-0.5 rounded-full font-bold">0</span>
    </div>

    <div id="driver-orders-container" class="space-y-4"></div>

  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC7b09veLZicac60Uuw0Sgb-cL3FtC4",
      authDomain: "alrokn-alshami.firebaseapp.com",
      projectId: "alrokn-alshami",
      storageBucket: "alrokn-alshami.appspot.com",
      messagingSenderId: "637299277948",
      appId: "1:637299277948:web:b2d029a2e72b41b4b889f9",
      measurementId: "G-38M27LBT11"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentDriverName = localStorage.getItem('rokn_driver_name') || '';
    let driverAudioAllowed = true;
    let wakeLock = null;

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    // تسجيل Service Worker مخصص لـ PWA والإشعارات
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {
        const swCode = `
          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('activate', (e) => self.clients.claim());
          self.addEventListener('notificationclick', (e) => {
            e.notification.close();
            e.waitUntil(clients.matchAll({ type: 'window', includeUncontrolled: true }).then(clientList => {
              for (const client of clientList) {
                if ('focus' in client) return client.focus();
              }
              if (clients.openWindow) return clients.openWindow('/');
            }));
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob));
      });
    }

    document.addEventListener('click', function() {
      if ("Notification" in window && Notification.permission === "default") {
        Notification.requestPermission();
      }
      const audio = document.getElementById('driver-alert-sound');
      if (audio) { audio.play().then(() => { audio.pause(); audio.currentTime = 0; }).catch(() => {}); }
      requestWakeLock();
    }, { once: true });

    window.addEventListener('DOMContentLoaded', () => {
      if (currentDriverName) {
        document.getElementById('driver-name-input').value = currentDriverName;
        document.getElementById('header-driver-display').innerText = "الكابتن: " + currentDriverName;
        registerOneSignalDriverTag(currentDriverName);
      }
      initDriverOrdersListener();
    });

    function registerOneSignalDriverTag(driverName) {
      const cleanName = driverName.trim().toLowerCase();
      if (window.OneSignalDeferred) {
        window.OneSignalDeferred.push(async function(OneSignal) {
          try { await OneSignal.User.addTag("driver_name", cleanName); } catch (e) {}
        });
      }
    }

    function toggleSoundSetting() {
      driverAudioAllowed = !driverAudioAllowed;
      const btn = document.getElementById('sound-toggle-btn');
      const audio = document.getElementById('driver-alert-sound');
      if (driverAudioAllowed) {
        btn.className = "bg-amber-500/20 border border-amber-500/40 text-amber-400 p-2.5 rounded-xl transition";
      } else {
        btn.className = "bg-stone-900 border border-stone-800 text-stone-500 p-2.5 rounded-xl transition";
        if (audio) { audio.pause(); audio.currentTime = 0; }
      }
    }

    function saveDriverName() {
      const val = document.getElementById('driver-name-input').value.trim();
      if (!val) return alert("ادخل اسمك أولاً");
      currentDriverName = val;
      localStorage.setItem('rokn_driver_name', currentDriverName);
      document.getElementById('header-driver-display').innerText = "الكابتن: " + currentDriverName;
      registerOneSignalDriverTag(currentDriverName);
      alert("تم تسجيل الكابتن بنجاح: " + currentDriverName);
      initDriverOrdersListener();
    }

    function initDriverOrdersListener() {
      db.ref('orders').on('value', (snapshot) => {
        const allOrders = snapshot.val() || {};
        const container = document.getElementById('driver-orders-container');
        const alertAudio = document.getElementById('driver-alert-sound');
        const todayStr = new Date().toISOString().split('T')[0];

        if (!currentDriverName) {
          container.innerHTML = `<div class="glass-card p-6 rounded-2xl text-center border border-stone-800 text-stone-400 text-xs font-bold">يرجى تسجيل اسمك أولاً</div>`;
          if (alertAudio) { alertAudio.pause(); alertAudio.currentTime = 0; }
          return;
        }

        let deliveredTodayCount = 0;
        let deliveryEarningsToday = 0;

        Object.values(allOrders).forEach(o => {
          const isAssigned = (o.driverName && o.driverName.toLowerCase().trim() === currentDriverName.toLowerCase().trim());
          const isDelivered = (o.status === 'تم التسليم' || o.status === 'مكتمل');
          const orderDate = o.date || (o.createdAt ? o.createdAt.split('T')[0] : '');

          if (isAssigned && isDelivered && (orderDate === todayStr || !orderDate)) {
            deliveredTodayCount++;
            deliveryEarningsToday += Number(o.deliveryFee || 0);
          }
        });

        document.getElementById('stat-driver-delivered-count').innerText = deliveredTodayCount;
        document.getElementById('stat-driver-delivery-total').innerText = deliveryEarningsToday + ' ج.م';

        const myOrders = Object.entries(allOrders).filter(([key, ord]) => {
          const isDelivery = (ord.orderType === 'delivery' || ord.orderType === 'توصيل' || ord.type === 'توصيل' || !ord.orderType);
          const isAssigned = (ord.driverName && ord.driverName.toLowerCase().trim() === currentDriverName.toLowerCase().trim());
          const isActiveStatus = (ord.status !== 'تم التسليم' && ord.status !== 'ملغي' && ord.status !== 'مكتمل');
          return isDelivery && isAssigned && isActiveStatus;
        });

        document.getElementById('orders-count-badge').innerText = myOrders.length;
        const unacceptedOrder = myOrders.find(([key, ord]) => !ord.driverAccepted);

        if (unacceptedOrder && driverAudioAllowed) {
          if (alertAudio.paused) { alertAudio.play().catch(() => {}); }
        } else {
          if (alertAudio) { alertAudio.pause(); alertAudio.currentTime = 0; }
        }

        if (myOrders.length === 0) {
          container.innerHTML = `
            <div class="glass-card p-8 rounded-2xl text-center border border-stone-800 space-y-2">
              <i class="fa-solid fa-motorcycle text-stone-600 text-2xl"></i>
              <p class="text-stone-300 font-bold text-xs">لا توجد طلبات جارية موجهة إليك حالياً</p>
            </div>
          `;
          return;
        }

        container.innerHTML = myOrders.map(([key, ord]) => {
          const custName = ord.customer ? ord.customer.name : (ord.name || 'عميل');
          const custPhone = ord.customer ? ord.customer.phone : (ord.phone || '');
          const orderId = ord.orderId || ord.id || key.slice(-5);
          const isAccepted = ord.driverAccepted === true;

          return `
            <div class="glass-card rounded-2xl p-4 border ${!isAccepted ? 'border-amber-500 ring-2 ring-amber-500/20 glow-ring' : 'border-stone-800'} space-y-3 shadow-2xl">
              <div class="flex justify-between items-center border-b border-stone-800 pb-2">
                <span class="font-black text-amber-400 text-lg">#${orderId}</span>
                <span class="px-3 py-1 rounded-xl text-xs ${isAccepted ? 'bg-purple-900/40 text-purple-300 font-bold' : 'bg-amber-500 text-stone-950 font-black animate-pulse'}">
                  ${isAccepted ? 'جاري التوصيل 🚀' : 'في انتظار قبولك 🔔'}
                </span>
              </div>
              <div class="space-y-1.5 text-xs text-stone-300 bg-stone-900/90 p-3 rounded-xl">
                <p class="font-bold text-white text-sm"><i class="fa-solid fa-user text-amber-500"></i> ${custName}</p>
                <p><i class="fa-solid fa-phone text-amber-500"></i> <a href="tel:${custPhone}" class="text-amber-400 font-mono">${custPhone}</a></p>
                <p><i class="fa-solid fa-location-dot text-amber-500"></i> ${ord.address || 'العنوان غير محدد'}</p>
              </div>
              <div class="flex justify-between text-xs bg-stone-900/40 p-2.5 rounded-xl border border-stone-800">
                <span class="text-stone-300 font-bold">المبلغ المطلوب تحصيله:</span>
                <span class="font-black text-amber-400 text-sm">${ord.total || 0} ج.م</span>
              </div>
              ${!isAccepted ? `
                <button onclick="acceptOrder('${key}')" class="w-full bg-amber-500 hover:bg-amber-600 text-stone-950 font-black py-3 rounded-xl text-xs shadow transition">
                  قبول الأوردر وإيقاف الصوت 🚀
                </button>
              ` : `
                <button onclick="markDelivered('${key}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl text-xs shadow transition">
                  تأكيد تسليم الأوردر ✅
                </button>
              `}
            </div>
          `;
        }).join('');
      });
    }

    function acceptOrder(key) { db.ref('orders/' + key).update({ driverAccepted: true, status: 'في الطريق' }); }
    function markDelivered(key) { if (confirm("هل تم التسليم واستلام المبلغ؟")) db.ref('orders/' + key).update({ status: 'تم التسليم', driverAccepted: true }); }
  </script>
</body>
</html>
